    <text class="word" transform="translate(50,50) rotate(136.800) translate(0,-43.0) rotate(180)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">R</text>
