    <text class="word" transform="translate(50,50) rotate(43.400) translate(0,-43.0)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">U</text>
    <text class="word" transform="translate(50,50) rotate(55.800) translate(0,-43.0)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">S</text>
    <text class="word" transform="translate(50,50) rotate(223.200) translate(0,-43.0) rotate(180)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">M</text>
    <text class="word" transform="translate(50,50) rotate(208.800) translate(0,-43.0) rotate(180)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">O</text>
    <text class="word" transform="translate(50,50) rotate(194.400) translate(0,-43.0) rotate(180)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">N</text>
    <text class="word" transform="translate(50,50) rotate(180.000) translate(0,-43.0) rotate(180)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">S</text>
    <text class="word" transform="translate(50,50) rotate(165.600) translate(0,-43.0) rotate(180)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">T</text>
