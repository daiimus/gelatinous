    <text class="word" transform="translate(50,50) rotate(-43.400) translate(0,-43.0)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">E</text>
    <text class="word" transform="translate(50,50) rotate(-31.000) translate(0,-43.0)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">L</text>
    <text class="word" transform="translate(50,50) rotate(-18.600) translate(0,-43.0)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">A</text>
    <text class="word" transform="translate(50,50) rotate(-6.200) translate(0,-43.0)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">T</text>
    <text class="word" transform="translate(50,50) rotate(6.200) translate(0,-43.0)" text-anchor="middle" font-family="Monaspace Xenon Var, ui-monospace, monospace" font-size="7.9" font-weight="600" fill="var(--terminal-text, #d8d3c4)" dy="0.34em">I</text>
